<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Mecsu Automation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --border: #e5e9f2;

      --text: #1f2937;
      --muted: #6b7280;

      --blue: #1f4fd8;
      --blue-soft: #eef2ff;

      --yellow: #fbbf24;
      --yellow-soft: #fff7db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== HEADER ===== */
    header {
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
    }

    .title-wrap .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== MAIN ===== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    input, select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      font-size: 14px;
    }

    input {
      flex: 1;
      min-width: 260px;
    }

    section {
      margin-bottom: 36px;
    }

    section h2 {
      font-size: 17px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: relative;
    }

    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--yellow-soft);
      color: #92400e;
      border: 1px solid var(--yellow);
    }

    .card-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--blue);
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .card-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #374151;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
    }

    .btn.primary {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    /* ===== FOOTER ===== */
    footer {
      background: white;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

</header>

<main class="container">

  <div class="controls">
    <input id="search" placeholder="Tìm Kiếm Công Cụ..." />
    <select id="category">
      <option value="ALL">All categories</option>
    </select>
  </div>

  <div id="content"></div>

</main>

<footer>
  Internal use only · Versioned tools · Auto-update enabled
</footer>

<script>
async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  return res.json();
}

async function loadToolsWithManifest() {
  const toolsData = await fetchJSON('tools.json');
  const tools = toolsData.tools || [];

  for (const t of tools) {
    try {
      const m = await fetchJSON(t.manifestUrl);
      t.latestVersion = m.latest.version;
      t.publishedAt = m.latest.publishedAt;
      t.downloadUrl = m.latest.downloadUrl;
    } catch (e) {
      t.downloadUrl = null;
    }
  }
  return tools;
}

function groupByCategory(tools) {
  const map = {};
  for (const t of tools) {
    const c = t.category || 'Other';
    if (!map[c]) map[c] = [];
    map[c].push(t);
  }
  return map;
}

function render(tools) {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.getElementById('category').value;

  const filtered = tools.filter(t => {
    const text = (t.name + ' ' + t.slug + ' ' + t.description).toLowerCase();
    const okText = !q || text.includes(q);
    const okCat = cat === 'ALL' || t.category === cat;
    return okText && okCat;
  });

  const grouped = groupByCategory(filtered);
  const content = document.getElementById('content');
  content.innerHTML = '';

  for (const category in grouped) {
    const section = document.createElement('section');
    section.innerHTML = `
      <h2>
        <span class="section-dot"></span>
        ${category}
      </h2>
    `;

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const t of grouped[category]) {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="badge">ACTIVE</div>

        <div class="card-title">${t.name}</div>
        <div class="card-meta">
          ${t.slug} · v${t.latestVersion || 'N/A'}
        </div>

        <div class="card-desc">${t.description}</div>

        <div class="card-meta">
          Last updated: ${t.publishedAt || '—'}
        </div>

        <div class="card-footer">
          <a class="btn" href="${t.docsUrl}">📘 Read Docs</a>
          ${
            t.downloadUrl
              ? `<a class="btn primary" href="${t.downloadUrl}">⬇ Download</a>`
              : `<span class="btn">Unavailable</span>`
          }
        </div>
      `;

      grid.appendChild(card);
    }

    section.appendChild(grid);
    content.appendChild(section);
  }
}

(async () => {
  const tools = await loadToolsWithManifest();

  const categories = [...new Set(tools.map(t => t.category))];
  const select = document.getElementById('category');
  for (const c of categories) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  }

  document.getElementById('search').addEventListener('input', () => render(tools));
  document.getElementById('category').addEventListener('change', () => render(tools));

  render(tools);
})();
</script>
